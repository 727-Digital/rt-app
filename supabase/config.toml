# Per-function settings.
#
# Supabase migrated the project's API keys to the new sb_publishable_* /
# sb_secret_* format. The Edge Functions gateway still requires JWT-format
# tokens in the Authorization header, so any internal edge-to-edge call
# using the new keys hits UNAUTHORIZED_INVALID_JWT_FORMAT.
#
# Functions marked verify_jwt = false are reachable without a JWT —
# they do their own body validation / origin checks. Setting this here
# makes future `supabase functions deploy` keep the flag, instead of
# defaulting back to verify_jwt = true.

# Called by receive-lead (server), QuoteView (browser anon, quote_viewed/
# quote_approved), ScheduleAppointment (browser auth). Must stay anon-
# reachable for the public quote page, so it cannot require auth; instead
# it throttles per (lead_id, type) to prevent amplification abuse and
# only fans out to legitimate team_members of the org on the row.
[functions.send-notification]
verify_jwt = false

# Called only by receive-lead after a FB leadgen webhook. Body validates
# event_name + lead_id.
[functions.fb-conversion]
verify_jwt = false

# Called by Stripe checkout flow and pg_cron — neither carries a user JWT.
[functions.process-follow-ups]
verify_jwt = false

# Lovable webhook + FB leadgen webhook — neither carries a JWT. The
# function checks WEBHOOK_SECRET / FB_VERIFY_TOKEN itself.
[functions.receive-lead]
verify_jwt = false

# Signal House SMS provider webhook — Signal House calls this URL with no
# Supabase JWT, so it must be gateway-public. Auth is enforced inside the
# function via the ?token=<SIGNALHOUSE_WEBHOOK_SECRET> shared secret
# appended to the webhook URL in the Signal House dashboard.
[functions.signalhouse-webhook]
verify_jwt = false

# Lead Sync Watchdog reconciler — triggered by pg_cron (no user JWT).
# Gated internally by the RECONCILE_SECRET shared secret.
[functions.reconcile-fb-leads]
verify_jwt = false
